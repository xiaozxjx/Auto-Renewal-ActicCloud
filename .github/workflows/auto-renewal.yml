name: ArcticCloud Auto Renewal

on:
  schedule:
    - cron: '37 14 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    permissions:
      contents: read   # 甚至不需要 write

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 运行续期脚本
      env:
        CONFIG: ${{ secrets.CONFIG }}
      run: python AutoRenewal.py

    - name: 上传日志
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: renewal-log
        path: "*.log"
        retention-days: 30
